    <style>
        /* ==========================================================================
           [💡 신규 고도화: 시니어용 글자 조정 클래스들]
           ========================================================================== */
        body {
            transition: font-size 0.25s ease-out, zoom 0.2s ease-out;
        }
        /* 💡 [전역 화면 레이아웃 및 폰트 일괄 돋보기 줌 기법 도입] */
        body.font-scale-medium {
            zoom: 1.15;
            -moz-transform: scale(1.15);
            -moz-transform-origin: top center;
        }
        body.font-scale-large {
            zoom: 1.35;
            -moz-transform: scale(1.35);
            -moz-transform-origin: top center;
        }

        /* ==========================================================================
           [💡 신규 고도화: 낮 테마 (라이트 모드) 전용 토큰 변수들]
           ========================================================================== */
        body.light-theme {
            --bg-dark: #faf9f2;          /* 눈부심을 완벽히 흡수하는 따뜻하고 아늑한 아이보리 크림 배경 */
            --bg-card: #ffffff;          /* 시인성 극대화를 위한 순백색 입체 카드 배경 */
            --panel-border: rgba(45, 106, 79, 0.15); /* 따뜻한 초록빛이 감도는 선명한 연한 테두리선 */
            
            --color-primary: #1b4d3e;    /* 약초의 생명력과 기품을 담은 차분하고 진한 딥 포레스트 그린 */
            --color-secondary: #2d6a4f;  /* 싱그러운 숲의 건강함을 형상화한 세이지 그린 */
            --color-accent: #c97a7e;     /* 처방 경고 시 부드럽고 명확하게 경고하는 인디안 로즈 */
            
            --text-main: #141f19;        /* 가독성 100%를 보장하는 극도로 또렷한 다크 스프루스 차콜 */
            --text-muted: #4a5d56;       /* 연하지 않고 또렷하게 읽히는 올리브 카키 슬레이트 보조 글자색 */
            
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-weight: 700;            /* 맑은 시인성을 위해 기본 글씨 두께 강화 */
        }

        /* ==========================================================================
           [Core Design System - Tokens & Root variables]
           ========================================================================== */
        :root {
            --bg-dark: #070913;
            --bg-card: rgba(17, 20, 36, 0.55);
            --panel-border: rgba(129, 140, 248, 0.08);
            
            --color-primary: #818cf8;    /* 감각적인 네온 인디고 */
            --color-secondary: #c084fc;  /* 세련된 네온 퍼플 */
            --color-accent: #6366f1;     /* 하이라이트 블루 */
            
            --text-main: #f1f5f9;
            --text-muted: #64748b;
            
            --status-safe: #10b981;      /* 안전: 초록 에메랄드 */
            --status-warn: #fbbf24;      /* 주의: 노랑 앰버 */
            --status-danger: #f87171;    /* 위험: 빨강 로즈 */
            
            --transition-smooth: all 0.35s cubic-bezier(0.25, 0.8, 0.25, 1);
            
            --glow-indigo: 0 0 20px rgba(129, 140, 248, 0.25);
            --glow-safe: 0 0 15px rgba(16, 185, 129, 0.4);
            --glow-warn: 0 0 15px rgba(251, 191, 36, 0.4);
            --glow-danger: 0 0 15px rgba(248, 113, 113, 0.4);
        }

        /* 스크롤바 커스터마이징 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 17, 28, 0.5);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(129, 140, 248, 0.15);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(129, 140, 248, 0.3);
        }

        /* 기본 리셋 마크업 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Noto Sans KR', 'Inter', sans-serif;
            overflow-x: hidden;
            display: flex;
            min-height: 100vh;
        }

        /* 프리미엄 백그라운드 앰비언트 글로우 이펙트 */
        .ambient-glow {
            position: fixed;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.08) 0%, rgba(192, 132, 252, 0) 70%);
            pointer-events: none;
            z-index: -1;
            filter: blur(80px);
        }

        .glow-1 { top: -100px; left: 10%; }
        .glow-2 { bottom: -150px; right: 5%; }


        /* ==========================================================================
           [SPA Left Sidebar Navigation Layout]
           ========================================================================== */
        .sidebar {
            width: 280px;
            background: rgba(10, 12, 22, 0.7);
            border-right: 1px solid var(--panel-border);
            padding: 40px 24px;
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            bottom: 0;
            left: 0;
            z-index: 100;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 45px;
            padding-left: 8px;
        }

        .logo-icon {
            font-size: 26px;
            color: var(--color-primary);
            filter: drop-shadow(0 0 8px rgba(129, 140, 248, 0.5));
            animation: floatSlow 2s ease-in-out infinite alternate;
        }

        .logo-text {
            font-family: 'Outfit', sans-serif;
            font-size: 22px;
            font-weight: 900;
            background: linear-gradient(135deg, #fff 30%, var(--color-primary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .sidebar-user {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 35px;
        }

        .user-avatar {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--color-primary), var(--color-secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            color: #fff;
            font-size: 18px;
            box-shadow: var(--glow-indigo);
            border: 1px solid rgba(255,255,255,0.15);
        }

        .user-info {
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .user-name {
            font-size: 15px;
            font-weight: 700;
            color: #fff;
        }

        .user-email {
            font-size: 11px;
            color: var(--text-muted);
            text-overflow: ellipsis;
            white-space: nowrap;
            overflow: hidden;
            margin-top: 2px;
        }

        .sidebar-menu {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 18px;
            border-radius: 12px;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-smooth);
            border: 1px solid transparent;
        }

        .menu-item:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.02);
            border-color: rgba(255, 255, 255, 0.02);
        }

        .menu-item.active {
            color: #fff;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.15), rgba(192, 132, 252, 0.05));
            border-color: rgba(129, 140, 248, 0.15);
            box-shadow: inset 0 0 12px rgba(129, 140, 248, 0.05);
        }

        .menu-item i {
            font-size: 16px;
            width: 20px;
            text-align: center;
        }

        .btn-logout {
            margin-top: auto;
            background: rgba(248, 113, 113, 0.05);
            border: 1px solid rgba(248, 113, 113, 0.1);
            color: #f87171;
            padding: 12px 18px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: var(--transition-smooth);
        }

        .btn-logout:hover {
            background: #f87171;
            color: #fff;
            box-shadow: 0 4px 15px rgba(248, 113, 113, 0.3);
            border-color: #f87171;
        }


        /* ==========================================================================
           [SPA Right Dashboard Board Panels]
           ========================================================================== */
        .main-content {
            margin-left: 280px;
            flex: 1;
            padding: 50px 60px;
            display: flex;
            flex-direction: column;
            gap: 40px;
            max-width: 1300px;
        }

        .panel-header {
            animation: fadeIn 0.5s ease-out;
        }

        .panel-title {
            font-family: 'Outfit', sans-serif;
            font-size: 32px;
            font-weight: 900;
            letter-spacing: -0.5px;
            color: #fff;
            margin-bottom: 8px;
        }

        .panel-subtitle {
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 500;
        }

        /* SPA 탭 패널 컨텐츠 기본 상태 제어 */
        .tab-panel {
            display: none;
            animation: slideUp 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .tab-panel.active {
            display: block;
        }

        /* 공통 프리미엄 글라스모피즘 카드 위젯 */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--panel-border);
            border-radius: 24px;
            padding: 35px;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            margin-bottom: 30px;
        }


        /* ==========================================================================
           [Form Controls - Input, Label, Textarea]
           ========================================================================== */
        .form-grid-profile {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
        }

        .form-group-full {
            grid-column: span 2;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-label {
            font-size: 13px;
            font-weight: 700;
            color: var(--color-primary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-input {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 14px 18px;
            color: #fff;
            font-size: 15px;
            transition: var(--transition-smooth);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--color-primary);
            background: rgba(129, 140, 248, 0.05);
            box-shadow: var(--glow-indigo);
        }

        /* 직접 타이핑 입력박스 아래 고속 식약처 추천 박스 */
        .search-suggestions-box {
            position: absolute;
            top: calc(100% + 5px);
            left: 0;
            right: 0;
            background: rgba(15, 17, 28, 0.95);
            border: 1px solid rgba(129, 140, 248, 0.3);
            border-radius: 12px;
            z-index: 1000;
            max-height: 250px;
            overflow-y: auto;
            backdrop-filter: blur(10px);
            display: none;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .search-suggestions-box.show {
            display: block;
        }

        .suggestion-item {
            padding: 12px 20px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #e2e8f0;
            border-bottom: 1px solid rgba(255,255,255,0.02);

        }

        .suggestion-item:hover {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(192, 132, 252, 0.05));

        }

        /* 💡 식약처 부분 일치 검색 전용 뱃지 스타일 */
        .candidate-badge {
            background: rgba(129, 140, 248, 0.08);
            border: 1px solid rgba(129, 140, 248, 0.2);
            border-radius: 10px;
            padding: 10px 16px;
            font-size: 13px;
            font-weight: 600;
            color: #e2e8f0;
            cursor: pointer;
            transition: var(--transition-smooth);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .candidate-badge:hover {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(192, 132, 252, 0.15));
            border-color: var(--color-primary);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(129, 140, 248, 0.15);
        }

        .candidate-badge:active {
            transform: translateY(0);
        }


        /* ==========================================================================
           [Core UI Components - Buttons]
           ========================================================================== */
        .btn-save {
            background: linear-gradient(135deg, var(--color-accent), var(--color-secondary));
            color: #fff;
            border: none;
            border-radius: 12px;
            padding: 14px 28px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.3);
            transition: var(--transition-smooth);
        }

        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(99, 102, 241, 0.5);
            filter: brightness(1.1);
        }

        .btn-save:active {
            transform: translateY(0);
        }


        /* ==========================================================================
           [SPA Panel Component: 1. 복용 히스토리 보드]
           ========================================================================== */
        .timeline {
            position: relative;
            padding-left: 30px;
        }

        .timeline::before {
            content: '';
            position: absolute;
            top: 0;
            bottom: 0;
            left: 7px;
            width: 2px;
            background: var(--panel-border);
        }

        .timeline-item {
            position: relative;
            margin-bottom: 40px;
        }

        .timeline-item:last-child {
            margin-bottom: 0;
        }

        .timeline-dot {
            position: absolute;
            left: -30px;
            top: 6px;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: var(--text-muted);
            border: 4px solid var(--bg-dark);
            z-index: 2;
            transition: var(--transition-smooth);
        }

        /* 신호등 연동 도트 램프 */
        .timeline-item.안전 .timeline-dot {
            background: var(--status-safe);
            box-shadow: var(--glow-safe);
        }

        .timeline-item.주의 .timeline-dot {
            background: var(--status-warn);
            box-shadow: var(--glow-warn);
        }

        .timeline-item.위험 .timeline-dot {
            background: var(--status-danger);
            box-shadow: var(--glow-danger);
        }

        .timeline-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            padding: 24px;
            transition: var(--transition-smooth);
        }

        .timeline-card:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.12);
            transform: translateX(5px);
        }

        .timeline-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .timeline-med-name {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
        }

        .timeline-action-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .timeline-badge {
            font-size: 12px;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 20px;
            text-transform: uppercase;
        }

        .timeline-badge.안전 {
            background: rgba(16, 185, 129, 0.15);
            color: var(--status-safe);
            border: 1px solid rgba(16, 185, 129, 0.25);
        }

        .timeline-badge.주의 {
            background: rgba(251, 191, 36, 0.15);
            color: var(--status-warn);
            border: 1px solid rgba(251, 191, 36, 0.25);
        }

        .timeline-badge.위험 {
            background: rgba(248, 113, 113, 0.15);
            color: var(--status-danger);
            border: 1px solid rgba(248, 113, 113, 0.25);
        }

        /* ⏰ 알림 예약 추가 버튼 */
        .btn-add-alarm-trigger {
            background: rgba(129, 140, 248, 0.1);
            color: var(--color-primary);
            border: 1px solid rgba(129, 140, 248, 0.2);
            border-radius: 8px;
            padding: 5px 12px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: var(--transition-smooth);
        }

        .btn-add-alarm-trigger:hover {
            background: var(--color-accent);
            color: #fff;
            border-color: var(--color-accent);
            box-shadow: var(--glow-indigo);
        }

        .timeline-date {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 14px;
        }

        .timeline-desc {
            font-size: 14px;
            line-height: 1.6;
            color: #9ca3af;
        }


        /* ==========================================================================
           [SPA Panel Component: 2. 신규 약물 등록 - 처방전 비전 비디오 드래그앤드롭]
           ========================================================================== */
        .register-container {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .file-upload-zone {
            border: 2px dashed rgba(129, 140, 248, 0.3);
            border-radius: 20px;
            padding: 50px 30px;
            text-align: center;
            background: rgba(255, 255, 255, 0.01);
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .file-upload-zone:hover, .file-upload-zone.active {
            border-color: var(--color-primary);
            background: rgba(129, 140, 248, 0.04);
            box-shadow: inset 0 0 20px rgba(129, 140, 248, 0.1);
        }

        .upload-icon {
            font-size: 45px;
            color: var(--color-primary);
            margin-bottom: 15px;
            filter: drop-shadow(0 4px 10px rgba(129, 140, 248, 0.3));
        }

        .upload-title {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 8px;
        }

        .upload-sub {
            font-size: 13px;
            color: var(--text-muted);
        }

        .file-input {
            display: none;
        }

        .uploaded-file-info {
            display: none;
            align-items: center;
            justify-content: space-between;
            background: rgba(16, 185, 129, 0.08);
            border: 1px solid rgba(16, 185, 129, 0.25);
            padding: 14px 20px;
            border-radius: 12px;
            animation: fadeIn 0.3s ease-out;
        }

        .uploaded-file-info.show {
            display: flex;
        }

        .file-detail {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--status-safe);
            font-size: 14px;
            font-weight: 600;
        }

        .btn-remove-file {
            background: transparent;
            border: none;
            color: #f87171;
            font-size: 16px;
            cursor: pointer;
            padding: 2px;
            transition: var(--transition-smooth);
        }

        .btn-remove-file:hover {
            color: #f87171;
            transform: scale(1.15);
        }

        /* 👵👴 [어르신용 이력 삭제 버튼 전용 소프트-레드 스타일 시트] */
        .btn-history-delete {
            background: rgba(248, 113, 113, 0.08) !important;
            color: #f87171 !important;
            border: 1px solid rgba(248, 113, 113, 0.2) !important;
            padding: 6px 14px;
            border-radius: 10px;
            font-size: 12.5px;
            font-weight: 800;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: var(--transition-smooth);
        }
        .btn-history-delete:hover {
            background: #ef4444 !important;
            color: #fff !important;
            border-color: #ef4444 !important;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.25);
            transform: translateY(-1px);
        }

        .divider-or {
            display: flex;
            align-items: center;
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .divider-or::before, .divider-or::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--panel-border);
        }

        .divider-or:not(:empty)::before { margin-right: 1.5em; }
        .divider-or:not(:empty)::after { margin-left: 1.5em; }


        /* ==========================================================================
           [SPA Panel Component: 3. AI 종합 위험도 리포트]
           ========================================================================== */
        .report-grid {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 40px;
            align-items: center;
        }

        /* 세련된 신호등 물리장치 모사 카드 */
        .traffic-light-card {
            background: rgba(10, 11, 18, 0.6);
            border: 1px solid var(--panel-border);
            border-radius: 24px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 4px 15px rgba(0,0,0,0.5);
        }

        .traffic-light-box {
            width: 70px;
            background: #1e1e2d;
            border-radius: 35px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.8), inset 0 2px 10px rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.02);
            margin-bottom: 25px;
        }

        .light-bulb {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background-color: #2a2a35;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.8);
            transition: var(--transition-smooth);
        }

        .light-bulb.red.active {
            background-color: var(--status-danger);
            box-shadow: var(--glow-danger);
        }

        .light-bulb.yellow.active {
            background-color: var(--status-warn);
            box-shadow: var(--glow-warn);
        }

        .light-bulb.green.active {
            background-color: var(--status-safe);
            box-shadow: var(--glow-safe);
        }

        .traffic-status-label {
            font-size: 24px;
            font-weight: 900;
            margin-bottom: 5px;
        }

        .traffic-status-desc {
            font-size: 13px;
            color: var(--text-muted);
            text-align: center;
            font-weight: 500;
        }

        .gauge-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .gauge-score-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .gauge-score-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--color-primary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .gauge-score-num {
            font-size: 40px;
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            color: #fff;
        }

        .gauge-container {
            width: 100%;
            height: 12px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--panel-border);
        }

        .gauge-bar {
            width: 0%;
            height: 100%;
            border-radius: 10px;
            background: var(--color-primary);
            box-shadow: var(--glow-indigo);
            transition: width 1.2s cubic-bezier(0.25, 1, 0.5, 1), background 0.3s;
        }

        .report-3lines {
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            padding: 25px;
            margin-top: 10px;
        }

        .report-3lines-title {
            font-size: 15px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 18px;
            color: #fff;
        }

        .report-3lines-title i {
            color: var(--color-primary);
            filter: drop-shadow(0 2px 8px rgba(129, 140, 248, 0.4));
        }

        .report-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .report-list-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            font-size: 14px;
            line-height: 1.6;
            color: #cbd5e1;
        }

        .report-list-item i {
            font-size: 16px;
            margin-top: 3px;
        }


        /* ==========================================================================
           [SPA Panel Component: 4. 복약 알림 달력]
           ========================================================================== */
        .calendar-wrapper {
            user-select: none;
        }

        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding: 0 10px;
        }

        .calendar-month-year {
            font-family: 'Outfit', sans-serif;
            font-size: 22px;
            font-weight: 800;
            color: #fff;
            letter-spacing: -0.5px;
        }

        .calendar-nav-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--panel-border);
            color: #fff;
            width: 38px;
            height: 38px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition-smooth);
        }

        .calendar-nav-btn:hover {
            background: var(--color-accent);
            border-color: var(--color-accent);
            box-shadow: var(--glow-indigo);
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 10px;
            text-align: center;
        }

        .day-label {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            padding-bottom: 10px;
            border-bottom: 1px solid var(--panel-border);
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .calendar-day {
            aspect-ratio: 1 / 1.1; /* 모바일/배지 유연성을 위해 약간 세로로 늘림 */
            background: rgba(255, 255, 255, 0.01);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: flex-start;
            padding: 10px;
            cursor: pointer;
            position: relative;
            transition: var(--transition-smooth);
        }

        .calendar-day:hover:not(.empty) {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(129, 140, 248, 0.3);
        }

        .calendar-day.empty {
            background: transparent;
            border-color: transparent;
            cursor: default;
        }

        .day-num {
            font-family: 'Outfit', sans-serif;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            z-index: 2;
        }

        .calendar-day:hover .day-num {
            color: #fff;
        }

        /* 복약 완료 체크 표시 상태 */
        .calendar-day.completed {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.1), rgba(16, 185, 129, 0.02));
            border-color: rgba(16, 185, 129, 0.2);
        }

        .calendar-day.completed .day-num {
            color: var(--status-safe) !important;
            font-weight: 800;
        }

        .completed-mark {
            display: none;
            position: absolute;
            top: 10px;
            right: 10px;
            color: var(--status-safe);
            font-size: 14px;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .calendar-day.completed .completed-mark {
            display: block;
        }

        /* 알람 스케줄 배지 레이아웃 (날짜 셀 내장) */
        .calendar-alarm-badges-list {
            display: flex;
            flex-direction: column;
            gap: 4px;
            width: 100%;
            margin-top: 5px;
            z-index: 5;
        }

        .calendar-badge-item {
            background: rgba(129, 140, 248, 0.12);
            border: 1px solid rgba(129, 140, 248, 0.25);
            color: var(--color-primary);
            font-size: 10px;
            font-weight: 700;
            padding: 3px 6px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 2px;
            width: 100%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: var(--transition-smooth);
        }

        .calendar-badge-item:hover {
            background: rgba(129, 140, 248, 0.25);
            border-color: rgba(129, 140, 248, 0.4);
            color: #fff;
        }

        .calendar-badge-delete-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 9px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 12px;
            height: 12px;
            border-radius: 3px;
            transition: var(--transition-smooth);
        }

        .calendar-badge-delete-btn:hover {
            background: rgba(248, 113, 113, 0.2);
            color: #f87171;
        }


        /* ==========================================================================
           [Core UI Components - Modal Settings]
           ========================================================================== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(4, 5, 8, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .alarm-schedule-modal {
            background: rgba(17, 19, 28, 0.95);
            border: 1px solid var(--panel-border);
            border-radius: 24px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.6);
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        .modal-overlay.active .alarm-schedule-modal {
            transform: scale(1);
        }

        .modal-header {
            padding: 24px 28px;
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 16px;
            font-weight: 700;
            color: #fff;
        }

        .modal-title i {
            color: var(--color-primary);
        }

        .btn-close-modal {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 24px;
            cursor: pointer;
            line-height: 1;
        }

        .btn-close-modal:hover {
            color: #fff;
        }

        .modal-body-form {
            padding: 28px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }


        /* ==========================================================================
           [대형 실시간 사이렌 경고 팝업창 디자인 (UX 추가 요구사항 2)]
           ========================================================================== */
        .alarm-alert-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(5, 1, 1, 0.95);

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s;

        .alarm-alert-icon-box {
            font-size: 80px;
            color: var(--status-danger);

            filter: drop-shadow(0 0 30px rgba(248, 113, 113, 0.6));
        }

        .alarm-alert-title {
            font-size: 28px;
            font-weight: 900;
            color: #fff;
            letter-spacing: -0.5px;
            margin-bottom: 15px;
        }

        .alarm-alert-medname {
            font-size: 38px;
            font-weight: 900;
            color: #fff;
            background: linear-gradient(135deg, #f87171, #f43f5e);
            padding: 15px 40px;
            border-radius: 20px;
            box-shadow: var(--glow-danger);
            margin-bottom: 25px;
            letter-spacing: -1px;
            border: 1px solid rgba(255,255,255,0.15);

        .alarm-alert-sub {
            font-size: 15px;
            color: var(--text-muted);
            text-align: center;
            line-height: 1.8;
            max-width: 500px;
            margin-bottom: 40px;

        .alarm-alert-btn-group {
            display: flex;
            align-items: center;
            gap: 20px;
            width: 100%;
            max-width: 440px;
        }


        /* ==========================================================================
           [AI 고속 연산 로딩 상태 화면 (UX 추가 요구사항 1)]
           ========================================================================== */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(5, 5, 8, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            z-index: 4000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s;
        }

        .loading-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .loading-spinner-box {
            position: relative;
            width: 120px;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
        }

        .spinner-ring {
            position: absolute;
            width: 100%;
            height: 100%;
            border: 3px solid transparent;
            border-top: 3px solid var(--color-primary);
            border-bottom: 3px solid var(--color-secondary);
            border-radius: 50%;
            animation: spin 1.5s linear infinite;
        }

        .spinner-icon {
            font-size: 40px;
            color: var(--color-primary);
            filter: drop-shadow(0 0 15px rgba(129, 140, 248, 0.5));
            animation: floatSlow 2s ease-in-out infinite alternate;
        }

        .loading-text {
            font-size: 20px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        .loading-subtext {
            font-size: 13px;
            color: var(--text-muted);
            text-align: center;
            max-width: 400px;
            line-height: 1.6;
        }


        /* ==========================================================================
           [글로벌 고품격 알림 창 토스트 컴포넌트 (UX 추가 요구사항 3)]
           ========================================================================== */
        .toast-container {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: rgba(15, 17, 26, 0.9);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            padding: 16px 28px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s;
        }

        .toast-container.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast-icon {
            font-size: 20px;
            display: flex;
            align-items: center;
        }

        .toast-icon.success { color: var(--status-safe); }
        .toast-icon.error { color: var(--status-danger); }
        .toast-icon.info { color: var(--color-primary); }

        .toast-message {
            font-size: 14px;
            font-weight: 600;
            color: #fff;
        }


        /* ==========================================================================
           [신규 고도화 디자인: 1. AI 약사 비서 'Pillip(필립)' 플로팅 위젯]
           ========================================================================== */
        .pillip-floating-widget {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 3500;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 15px;
            pointer-events: none; /* 🔧 투명 컨테이너가 카드를 가리던 문제 수정 */
        }

        /* 🔧 필립 버튼과 열린 채팅창만 다시 클릭 가능하게 */
        .pillip-bubble-trigger,
        .pillip-chat-board.active {
            pointer-events: auto;
        }

        .pillip-bubble-trigger {
            width: 65px;
            height: 65px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--color-accent), var(--color-secondary));
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff;
            font-size: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 8px 30px rgba(99, 102, 241, 0.4), 0 0 15px rgba(192, 132, 252, 0.2);
            transition: var(--transition-smooth);
            animation: pulseWidget 2s infinite;
        }

        .pillip-bubble-trigger:hover {
            transform: scale(1.1) rotate(5deg);
            box-shadow: 0 10px 35px rgba(99, 102, 241, 0.6), 0 0 25px rgba(192, 132, 252, 0.4);
        }

        .pillip-bubble-trigger i {
            animation: floatSlow 1.5s ease-in-out infinite alternate;
        }

        .pillip-chat-board {
            width: 380px;
            height: 520px;
            background: rgba(13, 15, 24, 0.95);
            border: 1px solid rgba(129, 140, 248, 0.2);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 15px 45px rgba(0,0,0,0.7);
            transform: translateY(30px) scale(0.9);
            opacity: 0;
            pointer-events: none;
            transition: var(--transition-smooth);
        }

        .pillip-chat-board.active {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }

        .pillip-chat-header {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(192, 132, 252, 0.05));
            border-bottom: 1px solid var(--panel-border);
            padding: 18px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .pillip-chat-title-box {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .pillip-profile-img {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4f46e5, #c084fc);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #fff;
            box-shadow: 0 0 10px rgba(129, 140, 248, 0.4);
            border: 1px solid rgba(255,255,255,0.15);
        }

        .pillip-chat-title-texts {
            display: flex;
            flex-direction: column;
        }

        .pillip-main-name {
            font-size: 15px;
            font-weight: 800;
            color: #fff;
        }

        .pillip-sub-name {
            font-size: 11px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .pillip-sub-name .online-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: var(--status-safe);
            box-shadow: 0 0 6px var(--status-safe);
        }

        .pillip-chat-close-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 18px;
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .pillip-chat-close-btn:hover {
            color: #f87171;
        }

        .pillip-chat-messages-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .pillip-msg-row {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            max-width: 85%;
        }

        .pillip-msg-row.received {
            align-self: flex-start;
        }

        .pillip-msg-row.sent {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .pillip-msg-bubble {
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 13.5px;
            line-height: 1.55;
        }

        .received .pillip-msg-bubble {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--panel-border);
            color: #e2e8f0;
            border-top-left-radius: 4px;
        }

        .sent .pillip-msg-bubble {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.8), rgba(99, 102, 241, 0.5));
            border: 1px solid rgba(129, 140, 248, 0.2);
            color: #fff;
            border-top-right-radius: 4px;
            box-shadow: 0 4px 15px rgba(99,102,241,0.15);
        }

        .pillip-typing-dot-box {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 4px 0;
        }

        .typing-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: var(--text-muted);
            animation: bounceTyping 1.2s infinite ease-in-out;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        .pillip-chat-input-area {
            border-top: 1px solid var(--panel-border);
            padding: 14px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(10, 11, 18, 0.4);
        }

        .pillip-chat-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 10px 14px;
            color: #fff;
            font-size: 13px;
            outline: none;
            transition: var(--transition-smooth);
        }

        .pillip-chat-input:focus {
            border-color: var(--color-primary);
            background: rgba(129, 140, 248, 0.04);
        }

        .pillip-chat-send-btn {
            background: var(--color-accent);
            border: none;
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition-smooth);
            box-shadow: 0 4px 10px rgba(99,102,241,0.3);
        }

        .pillip-chat-send-btn:hover {
            background: var(--color-secondary);
            box-shadow: 0 4px 12px rgba(192,132,252,0.4);
            transform: scale(1.05);
        }

        /* 💡 [신규 고도화: AI 약사 필립 세션 분기 대화방 UI 스타일 정의] */
        .pillip-chat-rooms-area {
            flex-grow: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: rgba(13, 15, 24, 0.98);
        }

        .pillip-rooms-scroller {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* 개별 대화방 카드 디자인 */
        .pillip-room-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            padding: 12px 14px;
            cursor: pointer;
            transition: var(--transition-smooth);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .pillip-room-card:hover {
            background: rgba(129, 140, 248, 0.08);
            border-color: rgba(129, 140, 248, 0.25);
            transform: translateY(-2px);
        }

        .pillip-room-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .pillip-room-card-title {
            font-size: 13px;
            font-weight: 700;
            color: #ffffff;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* 식약처 분석 위험 뱃지 */
        .pillip-room-card-badge {
            font-size: 10px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 20px;
        }

        .pillip-room-card-badge.badge-safe {
            background: rgba(16, 185, 129, 0.12);
            color: var(--status-safe);
            border: 1px solid rgba(16, 185, 129, 0.25);
        }

        .pillip-room-card-badge.badge-warning {
            background: rgba(245, 158, 11, 0.12);
            color: var(--status-warning);
            border: 1px solid rgba(245, 158, 11, 0.25);
        }

        .pillip-room-card-badge.badge-danger {
            background: rgba(239, 68, 68, 0.12);
            color: var(--status-danger);
            border: 1px solid rgba(239, 68, 68, 0.25);
        }

        .pillip-room-card-desc {
            font-size: 11px;
            color: var(--text-muted);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* 룸 카드 안의 실시간 동적 대화 요약본 */
        .pillip-room-card-lastmsg {
            font-size: 12px;
            color: #cbd5e1;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding-top: 6px;
            margin-top: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.4;
        }

        /* 채팅방 상단 뒤로가기 버튼 */
        .pillip-chat-back-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 16px;
            margin-right: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            border-radius: 6px;
            transition: var(--transition-smooth);
        }

        .pillip-chat-back-btn:hover {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.08);
        }


        /* ==========================================================================
           [신규 고도화 디자인: 2. 아코디언 상세 정보창 레이아웃 & 테이블 스타일]
           ========================================================================== */
        .accordion-trigger-btn {
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--panel-border);
            color: var(--text-muted);
            border-radius: 8px;
            padding: 6px 14px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: var(--transition-smooth);
            margin-top: 10px;
        }

        .accordion-trigger-btn:hover {
            background: rgba(255,255,255,0.06);
            color: #fff;
            border-color: rgba(255,255,255,0.15);
        }

        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            margin-top: 0;
            opacity: 0;
        }

        .accordion-content.open {
            max-height: 1200px; /* 상세 텍스트가 풍부할 경우를 대비하여 넉넉히 설정 */
            margin-top: 15px;
            opacity: 1;
        }

        .kfda-table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(10, 11, 18, 0.3);
            border: 1px solid rgba(255,255,255,0.03);
            border-radius: 12px;
            overflow: hidden;
            font-size: 13px;
        }

        .kfda-table tr {
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }

        .kfda-table tr:last-child {
            border-bottom: none;
        }

        .kfda-th {
            background: rgba(129, 140, 248, 0.05);
            color: var(--color-primary);
            font-weight: 700;
            width: 120px;
            padding: 12px 15px;
            text-align: left;
            vertical-align: top;
            border-right: 1px solid rgba(255,255,255,0.03);
        }

        .kfda-td {
            padding: 12px 15px;
            color: #cbd5e1;
            line-height: 1.6;
        }

        .accordion-btn-group {
            display: flex;
            gap: 10px;
            margin-top: 12px;
            padding: 5px 0;
        }

        .btn-mini-consult {
            background: rgba(192, 132, 252, 0.1);
            color: var(--color-secondary);
            border: 1px solid rgba(192, 132, 252, 0.2);
            border-radius: 6px;
            padding: 5px 12px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: var(--transition-smooth);
        }

        .btn-mini-consult:hover {
            background: var(--color-secondary);
            color: #fff;
            box-shadow: 0 0 10px rgba(192,132,252,0.3);
        }


        /* ==========================================================================
           [신규 고도화 디자인: 3. Chart.js 게이지 차트 레이아웃 디자인]
           ========================================================================== */
        .chart-gauge-wrapper {
            position: relative;
            width: 100%;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 5px;
        }
